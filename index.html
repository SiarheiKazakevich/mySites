<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/style.css">
  <link rel="icon" href="./photos/logo.jpg" type="icon">
  <title>Mysites</title>
</head>

<body>
  <h2>MySites</h2>

  <div class="filters">
    <input type="text" id="search" placeholder="поиск..." oninput="renderProjects()">
    <select id="statusFilter" onchange="renderProjects()">
      <option value="all">все</option>
      <option value="active">активные</option>
      <option value="done">сделанные</option>
    </select>
  </div>



  <div class="container" id="projects"></div>
  <h3>Добавить проект</h3>
  <input type="text" id="name" placeholder="Название">
  <input type="text" id="link" placeholder="Ссылка на сайт">
  <input type="text" id="task" placeholder="Ссылка на задание">
  <textarea id="todo" placeholder="Что сделать"></textarea>
  <button onclick="addProject()">Добавить</button>

  <script src="./scripts/script.js"></script>
  <script src="./scripts/falsescript.js"></script>
  <script src="./scripts/falsescript2.js"></script>
  <script src="./scripts/grokFalsescript.js"></script>
</body>

</html>
